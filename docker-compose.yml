services:
  argus:
    image: argus-app
    container_name: argus_container
    restart: unless-stopped
    networks:
      - gateway_net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

networks:
  gateway_net:
    external: true