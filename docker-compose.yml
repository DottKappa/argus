services:
  argus:
    build: .
    image: argus-app
    container_name: argus_container
    restart: unless-stopped
    ports:
      - "127.0.0.1:6080:6080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

networks:
  gateway_net:
    external: true